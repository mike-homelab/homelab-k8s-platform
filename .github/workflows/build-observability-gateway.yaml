name: Build Observability Gateway Image

on:
  push:
    branches:
      - main
    paths:
      - images/monitoring/observability-gateway/**
      - .github/workflows/build-observability-gateway.yaml
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Observability Gateway
    runs-on: arc-runner-set
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=$(cat images/monitoring/observability-gateway/VERSION)" >> $GITHUB_OUTPUT

      - name: Log in to Harbor Docker registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
            docker login harbor.michaelhomelab.work \
              --username "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t harbor.michaelhomelab.work/homelab/monitoring/observability-gateway:latest \
            -t harbor.michaelhomelab.work/homelab/monitoring/observability-gateway:${{ steps.get_version.outputs.VERSION }} \
            images/monitoring/observability-gateway

      - name: Push Docker image
        run: |
          for tag in latest ${{ steps.get_version.outputs.VERSION }}; do
            for i in 1 2 3 4 5; do
              echo "Attempt $i: Pushing observability-gateway:$tag...";
              docker push harbor.michaelhomelab.work/homelab/monitoring/observability-gateway:$tag && break || sleep 15;
            done
          done

      - name: Clean up Docker image
        if: always()
        run: |
          docker rmi harbor.michaelhomelab.work/homelab/monitoring/observability-gateway:latest || true
          docker rmi harbor.michaelhomelab.work/homelab/monitoring/observability-gateway:${{ steps.get_version.outputs.VERSION }} || true
