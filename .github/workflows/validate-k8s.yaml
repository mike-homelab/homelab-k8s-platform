name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main
    paths:
      - 'clusters/**'
      - '.github/workflows/validate-k8s.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'clusters/**'
      - '.github/workflows/validate-k8s.yaml'

jobs:
  kustomize-build:
    name: Validate Kustomizations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.1"

      - name: Build All Kustomize Overlays
        run: |
          set -e
          echo "Scanning all kustomization.yaml directories..."
          find clusters/ -name "kustomization.yaml" -exec dirname {} \; | while read dir; do
            echo "==> Building $dir"
            kustomize build "$dir" > /dev/null
          done
          echo "All Kustomize overlays built successfully!"
