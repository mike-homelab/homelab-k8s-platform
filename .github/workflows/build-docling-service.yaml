name: Build Kito Docling Service Image

on:
  push:
    branches:
      - main
    paths:
      - images/ai-application/kito/docling-service/**
      - .github/workflows/build-docling-service.yaml
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Kito Docling Service
    runs-on: arc-runner-set
    timeout-minutes: 60    # Larger timeout: CUDA base + PyTorch cu128 + Docling models ~5GB total

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=$(cat images/ai-application/kito/docling-service/VERSION)" >> $GITHUB_OUTPUT

      - name: Wait for Docker daemon
        run: |
          echo "Waiting for Docker daemon to start..."
          for i in {1..30}; do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "Docker daemon failed to start"
          exit 1

      - name: Log in to Harbor Docker registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
            docker login harbor.michaelhomelab.work \
              --username "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t harbor.michaelhomelab.work/kito/docling-service:latest \
            -t harbor.michaelhomelab.work/kito/docling-service:${{ steps.get_version.outputs.VERSION }} \
            images/ai-application/kito/docling-service

      - name: Push Docker image
        run: |
          for tag in latest ${{ steps.get_version.outputs.VERSION }}; do
            for i in 1 2 3 4 5; do
              echo "Attempt $i: Pushing kito/docling-service:$tag...";
              docker push harbor.michaelhomelab.work/kito/docling-service:$tag && break || sleep 15;
            done
          done

      - name: Clean up Docker image
        if: always()
        run: |
          docker rmi harbor.michaelhomelab.work/kito/docling-service:latest || true
          docker rmi harbor.michaelhomelab.work/kito/docling-service:${{ steps.get_version.outputs.VERSION }} || true
