name: Build Kito PDF Splitter Image

on:
  push:
    branches:
      - main
    paths:
      - images/ai-application/kito/pdf-splitter/**
      - .github/workflows/build-pdf-splitter.yaml
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Kito PDF Splitter
    runs-on: [self-hosted]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=$(cat images/ai-application/kito/pdf-splitter/VERSION)" >> $GITHUB_OUTPUT

      - name: Log in to Harbor Docker registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
            docker login harbor.michaelhomelab.work \
              --username "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t harbor.michaelhomelab.work/kito/pdf-splitter:latest \
            -t harbor.michaelhomelab.work/kito/pdf-splitter:${{ steps.get_version.outputs.VERSION }} \
            images/ai-application/kito/pdf-splitter

      - name: Push Docker image
        run: |
          for tag in latest ${{ steps.get_version.outputs.VERSION }}; do
            for i in 1 2 3 4 5; do
              echo "Attempt $i: Pushing kito/pdf-splitter:$tag...";
              docker push harbor.michaelhomelab.work/kito/pdf-splitter:$tag && break || sleep 15;
            done
          done

      - name: Clean up Docker image
        if: always()
        run: |
          docker rmi harbor.michaelhomelab.work/kito/pdf-splitter:latest || true
          docker rmi harbor.michaelhomelab.work/kito/pdf-splitter:${{ steps.get_version.outputs.VERSION }} || true
