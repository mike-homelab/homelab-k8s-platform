name: Build vLLM Embedding Image
# trigger rebuild marker: 2026-04-10

on:
  push:
    branches:
      - main
    paths:
      - images/ai-platform/vllm/embedding/**
      - .github/workflows/build-vllm-embedding.yaml
  workflow_dispatch:

jobs:
  build:
    name: Build & Push vLLM Embedding
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Harbor Docker registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
            docker login harbor.michaelhomelab.work \
              --username "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t harbor.michaelhomelab.work/devops-tools/ai-platform/vllm-embedding:latest \
            images/ai-platform/vllm/embedding

      - name: Push Docker image
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Pushing harbor.michaelhomelab.work/devops-tools/ai-platform/vllm-embedding:latest...";
            docker push harbor.michaelhomelab.work/devops-tools/ai-platform/vllm-embedding:latest && break || sleep 15;
          done
      - name: Clean up Docker image
        if: always()
        run: |
          docker rmi harbor.michaelhomelab.work/devops-tools/ai-platform/vllm-embedding:latest || true
