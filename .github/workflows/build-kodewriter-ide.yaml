name: Build Kodewriter IDE Image

on:
  push:
    branches:
      - main
    paths:
      - images/ai-agent/coding-agent/kodewriter-ide/**
      - .github/workflows/build-kodewriter-ide.yaml
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Kodewriter IDE
    runs-on: [self-hosted]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=$(cat images/ai-agent/coding-agent/kodewriter-ide/VERSION)" >> $GITHUB_OUTPUT

      - name: Log in to Harbor Docker registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
            docker login harbor.michaelhomelab.work \
              --username "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t harbor.michaelhomelab.work/homelab/ai-agent/coding-agent/kodewriter-ide:latest \
            -t harbor.michaelhomelab.work/homelab/ai-agent/coding-agent/kodewriter-ide:${{ steps.get_version.outputs.VERSION }} \
            images/ai-agent/coding-agent/kodewriter-ide

      - name: Push Docker image
        run: |
          for tag in latest ${{ steps.get_version.outputs.VERSION }}; do
            docker push harbor.michaelhomelab.work/homelab/ai-agent/coding-agent/kodewriter-ide:$tag
          done
