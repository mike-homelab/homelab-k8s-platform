apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse
  namespace: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
  template:
    metadata:
      labels:
        app: langfuse
    spec:
      containers:
        - name: langfuse
          image: langfuse/langfuse:3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1228"
            - name: DATABASE_URL
              value: "postgresql://langfuse:langfuse-password-123@langfuse-db:5432/langfuse"
            - name: NEXTAUTH_URL
              value: "https://langfuse.michaelhomelab.work"
            - name: NEXTAUTH_SECRET
              value: "my-very-secret-nextauth-token"
            - name: SALT
              value: "my-very-secret-salt"
            - name: ENCRYPTION_KEY
              value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse:8123"
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://default:clickhouse-password-123@clickhouse:9000/default"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              value: "clickhouse-password-123"
            - name: CLICKHOUSE_DB
              value: "default"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: "langfuse-events"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://minio.monitoring.svc:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: "17uuYRVLzEsc3HMa9lQ5"
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              value: "gmYROYuVNQCAzx3EpkXk4W8EP2Nc9FKDJhRzJX1U"
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "us-east-1"
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: ai-platform
spec:
  selector:
    app: langfuse
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
