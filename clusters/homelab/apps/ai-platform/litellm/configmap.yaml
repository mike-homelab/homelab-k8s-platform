apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-platform
data:
  config.yaml: |
    model_list:
      - model_name: "builder"
        litellm_params:
          model: "ollama_chat/builder"
          api_base: "http://builder.ai-platform.svc:11434"
          num_ctx: 32768
          model_info:
            supports_function_calling: true
      - model_name: "coder"
        litellm_params:
          model: "ollama_chat/coder"
          api_base: "http://coder.ai-platform.svc:11434"
          num_ctx: 32768
          model_info:
            supports_function_calling: true
      - model_name: "analyst"
        litellm_params:
          model: "ollama_chat/coder"
          api_base: "http://coder.ai-platform.svc:11434"
          num_ctx: 32768
          timeout: 300        # 5 min — allows cold model reload from disk into VRAM
          model_info:
            supports_function_calling: true

    litellm_settings:
      drop_params: true
      set_verbose: true
      callbacks: ["prometheus", "langfuse"]