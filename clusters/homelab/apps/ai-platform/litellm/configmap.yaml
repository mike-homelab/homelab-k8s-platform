apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai-platform
data:
  config.yaml: |
    model_list:
      - model_name: "builder"
        litellm_params:
          model: "ollama_chat/builder"
          api_base: "http://builder.ai-platform.svc:11434"
          num_ctx: 65536
          model_info:
            supports_function_calling: true
      - model_name: "analyst"
        litellm_params:
          model: "ollama_chat/analyst"
          api_base: "http://analyst.ai-platform.svc:11434"
          num_ctx: 8192   # Analyst only routes tool calls — 8K context is ample
          model_info:
            supports_function_calling: true

    litellm_settings:
      drop_params: true
      set_verbose: true
      callbacks: ["prometheus", "langfuse"]