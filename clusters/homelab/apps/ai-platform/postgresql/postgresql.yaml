apiVersion: v1
kind: Secret
metadata:
  name: langfuse-db-secret
  namespace: ai-platform
type: Opaque
stringData:
  postgres-password: "langfuse-password-123"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-db-pvc
  namespace: ai-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-db
  namespace: ai-platform
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-db
  template:
    metadata:
      labels:
        app: langfuse-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: langfuse
            - name: POSTGRES_USER
              value: langfuse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-db-secret
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: langfuse-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-db
  namespace: ai-platform
spec:
  selector:
    app: langfuse-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
