apiVersion: batch/v1
kind: CronJob
metadata:
  name: langfuse-db-cleanup
  namespace: ai-platform
spec:
  schedule: "0 2 * * *" # Every day at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: langfuse-db-secret
                      key: postgres-password
              command:
                - /bin/sh
                - -c
                - |
                  psql -h langfuse-db -U langfuse -d langfuse -c "DELETE FROM traces WHERE timestamp < NOW() - INTERVAL '7 days';"
                  psql -h langfuse-db -U langfuse -d langfuse -c "DELETE FROM observations WHERE start_time < NOW() - INTERVAL '7 days';"
          restartPolicy: OnFailure
