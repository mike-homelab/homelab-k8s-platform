---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coder
  namespace: ai-platform
spec:
  serviceName: coder
  replicas: 1
  selector:
    matchLabels:
      app: coder

  template:
    metadata:
      labels:
        app: coder
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics/"
        prometheus.io/port: "11434"

    spec:
      nodeSelector:
        kubernetes.io/os: linux
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-5070-Ti

      terminationGracePeriodSeconds: 60

      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          imagePullPolicy: Always

          command: ["/bin/bash", "-c"]

          args:
            - |
              set -euxo pipefail

              ollama serve &
              SERVER_PID=$!

              until ollama list >/dev/null 2>&1; do
                sleep 2
              done

              echo "Pulling qwen2.5-coder:14b..."

              ollama pull qwen2.5-coder:14b

              cat <<EOF >/tmp/Modelfile
              FROM qwen2.5-coder:14b
              PARAMETER num_ctx 32768
              PARAMETER use_mmap false
              EOF

              ollama create coder -f /tmp/Modelfile

              kill $SERVER_PID

          env:
            - name: OLLAMA_MODELS
              value: /models

          volumeMounts:
            - name: hf-cache
              mountPath: /models

          resources:
            requests:
              cpu: "2"
              memory: "6Gi"

      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: Always

          command: ["/bin/bash", "-c"]
          args:
            - |
              # Start ollama in background
              ollama serve &
              OLLAMA_PID=$!

              # Wait for HTTP server to be ready
              until ollama list >/dev/null 2>&1; do
                sleep 2
              done

              # Pre-load the model so first user request is instant.
              # OLLAMA_KEEP_ALIVE=-1 keeps it in VRAM permanently after this.
              echo "Pre-loading coder model into VRAM..."
              ollama run coder "ready" >/dev/null 2>&1 || echo "Pre-load attempt finished (may need retry)"
              echo "Model pre-load complete"

              # Keep container alive — wait for ollama process
              wait $OLLAMA_PID

          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"

            - name: OLLAMA_MODELS
              value: /models

            - name: OLLAMA_NUM_CTX
              value: "32768"

            - name: OLLAMA_NUM_PARALLEL
              value: "1"

            - name: OLLAMA_FLASH_ATTENTION
              value: "1"

            - name: OLLAMA_KV_CACHE_TYPE
              value: "q4_0"

            - name: OLLAMA_KEEP_ALIVE
              value: "-1"

            - name: OLLAMA_LOAD_TIMEOUT
              value: "30m"   # Longhorn network storage is slow for initial model load

            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"

            - name: OLLAMA_LOG_FORMAT
              value: "json"

            - name: GIN_MODE
              value: "release"

          ports:
            - name: http
              containerPort: 11434

          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 20

          resources:
            requests:
              cpu: "6"
              memory: "12Gi"
              nvidia.com/gpu: "1"

            limits:
              cpu: "8"
              memory: "20Gi"
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: hf-cache
              mountPath: /models

  volumeClaimTemplates:
    - metadata:
        name: hf-cache
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 120Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coder
  namespace: ai-platform

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics/"
    prometheus.io/port: "11434"

spec:
  type: ClusterIP

  selector:
    app: coder

  ports:
    - name: http
      port: 11434
      targetPort: http
