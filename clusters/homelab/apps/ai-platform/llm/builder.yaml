---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: builder
  namespace: ai-platform
spec:
  serviceName: builder
  replicas: 1

  selector:
    matchLabels:
      app: builder

  template:
    metadata:
      labels:
        app: builder

      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics/"
        prometheus.io/port: "11434"

    spec:
      nodeSelector:
        kubernetes.io/os: linux
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-5060-Ti

      terminationGracePeriodSeconds: 60

      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          imagePullPolicy: Always

          command: ["/bin/bash", "-c"]

          args:
            - |
              set -euxo pipefail

              ollama serve &
              SERVER_PID=$!

              until ollama list >/dev/null 2>&1; do
                sleep 2
              done

              echo "Pulling qwen3-vl:8b..."

              ollama pull qwen3-vl:8b

              cat <<EOF >/tmp/Modelfile
              FROM qwen3-vl:8b
              PARAMETER num_ctx 65536
              EOF

              ollama create builder -f /tmp/Modelfile

              kill $SERVER_PID

          env:
            - name: OLLAMA_MODELS
              value: /models

          volumeMounts:
            - name: hf-cache
              mountPath: /models

          resources:
            requests:
              cpu: "2"
              memory: "6Gi"

      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: Always

          args: ["serve"]

          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"

            - name: OLLAMA_MODELS
              value: /models

            - name: OLLAMA_NUM_CTX
              value: "65536"

            - name: OLLAMA_NUM_PARALLEL
              value: "2"

            - name: OLLAMA_FLASH_ATTENTION
              value: "1"

            - name: OLLAMA_KV_CACHE_TYPE
              value: "q4_0"

            - name: OLLAMA_KEEP_ALIVE
              value: "-1"

            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"

            - name: OLLAMA_LOG_FORMAT
              value: "json"

            - name: GIN_MODE
              value: "release"

          ports:
            - name: http
              containerPort: 11434

          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 20

          resources:
            requests:
              cpu: "6"
              memory: "12Gi"
              nvidia.com/gpu: "1"

            limits:
              cpu: "10"
              memory: "20Gi"
              nvidia.com/gpu: "1"

          volumeMounts:
            - name: hf-cache
              mountPath: /models

  volumeClaimTemplates:
    - metadata:
        name: hf-cache

      spec:
        storageClassName: longhorn

        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 120Gi
---
apiVersion: v1
kind: Service
metadata:
  name: builder
  namespace: ai-platform

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics/"
    prometheus.io/port: "11434"

spec:
  type: ClusterIP

  selector:
    app: builder

  ports:
    - name: http
      port: 11434
      targetPort: http