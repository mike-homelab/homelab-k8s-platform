apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: perception
  namespace: ai-platform
spec:
  serviceName: perception
  replicas: 1
  selector:
    matchLabels:
      app: perception
  template:
    metadata:
      labels:
        app: perception
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        nvidia.com/gpu.product: NVIDIA-GeForce-RTX-3060
      containers:
        - name: qwen-perception
          image: harbor.michaelhomelab.work/homelab/ai-platform/vllm-embedding:latest
          imagePullPolicy: Always
          command: ["/bin/bash"]
          args: 
            - "-c"
            - |
              # Embedding Service: GTE-Qwen2-1.5B
              python3 -m vllm.entrypoints.openai.api_server \
                --model Alibaba-NLP/gte-Qwen2-1.5B-instruct \
                --port 8000 \
                --gpu-memory-utilization 0.45 \
                --max-model-len 8192 \
                --otlp-traces-endpoint $(OTEL_EXPORTER_OTLP_ENDPOINT) &
              
              # Reranking Service: GTE-Multilingual-Reranker
              python3 -m vllm.entrypoints.openai.api_server \
                --model Alibaba-NLP/gte-multilingual-reranker-base \
                --port 8001 \
                --gpu-memory-utilization 0.45 \
                --max-model-len 1024 \
                --otlp-traces-endpoint $(OTEL_EXPORTER_OTLP_ENDPOINT) &
              
              wait
          env:
            - name: VLLM_OTEL_TRACING
              value: "1"
          envFrom:
            - configMapRef:
                name: vllm-otel-env
          ports:
            - name: embed
              containerPort: 8000
            - name: rerank
              containerPort: 8001
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: "20Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
  volumeClaimTemplates:
    - metadata:
        name: hf-cache
      spec:
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 40Gi
---
apiVersion: v1
kind: Service
metadata:
  name: perception
  namespace: ai-platform
  labels:
    app: perception
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app: perception
  ports:
    - name: embed
      port: 8000
      targetPort: 8000
    - name: rerank
      port: 8001
      targetPort: 8001
