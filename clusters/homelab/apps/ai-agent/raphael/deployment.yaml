apiVersion: apps/v1
kind: Deployment
metadata:
  name: raphael
  namespace: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raphael
  template:
    metadata:
      labels:
        app: raphael
    spec:
      containers:
      - name: raphael
        image: harbor.michaelhomelab.work/homelab/ai-agent/raphael:0.3.5
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: REDIS_HOST
          value: "raphael-redis"
        - name: QDRANT_HOST
          value: "raphael-qdrant"
        - name: LLM_HOST
          value: "http://litellm.ai-platform.svc:4000/v1"
        - name: LLM_KEY
          value: "sk-michael-homelab-llm-proxy"
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: raphael-secrets
              key: DISCORD_TOKEN
        - name: DISCORD_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: raphael-secrets
              key: DISCORD_WEBHOOK_URL
        - name: MENTION_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: raphael-secrets
              key: MENTION_ROLE_ID
        - name: DISCORD_CHANNEL_ID
          value: "1314965373666549535"
        - name: DISCORD_GUILD_ID
          value: "1497901155634909276"
        - name: DISCORD_APP_ID
          value: "1497902452417237083"
        - name: OTEL_HOST
          value: "observability-gateway.monitoring.svc.cluster.local"
        - name: OTEL_PORT
          value: "8000"
        - name: OTEL_METRICS_ENDPOINT
          value: "/metrics"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: "/metrics"
          prometheus.io/port: "8000"
