apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvscode-server
  namespace: coding-agent

spec:
  strategy:
    type: Recreate

  replicas: 1

  selector:
    matchLabels:
      app: openvscode-server

  template:
    metadata:
      labels:
        app: openvscode-server

    spec:
      containers:
        - name: openvscode-server
          image: lscr.io/linuxserver/vscodium-web:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
            - name: PATH
              value: "/lsiopy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/config/.opencode/bin"
            - name: VSCODE_GALLERY_SERVICE_URL
              value: "https://marketplace.visualstudio.com/_apis/public/gallery"
            - name: VSCODE_GALLERY_ITEM_URL
              value: "https://marketplace.visualstudio.com/items"
            - name: VSCODE_GALLERY_CACHE_URL
              value: "https://vscode.blob.core.windows.net/gallery/index"
            - name: VSCODE_GALLERY_CONTROL_URL
              value: ""
            # Setting CONNECTION_TOKEN if needed, or leave open for internal cluster access
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: data
              mountPath: /config
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-pvc
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  selector:
    app: openvscode-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 8000