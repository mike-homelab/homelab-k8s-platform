apiVersion: v1
kind: ConfigMap
metadata:
  name: kodewriter-extension
  namespace: coding-agent
data:
  package.json: |
    {
      "name": "kodewriter-agent-chat",
      "displayName": "Kodewriter Agent Chat",
      "version": "0.1.1",
      "publisher": "kodewriter",
      "engines": { "vscode": "^1.60.0" },
      "categories": [ "Other" ],
      "activationEvents": ["*"],
      "contributes": {
        "viewsContainers": {
          "activitybar": [
            {
              "id": "kodewriter-chat-container",
              "title": "Kodewriter Chat",
              "icon": "$(robot)"
            }
          ]
        },
        "views": {
          "kodewriter-chat-container": [
            {
              "type": "webview",
              "id": "kodewriter.chatView",
              "name": "Agent Chat Box"
            }
          ]
        }
      },
      "main": "./extension.js"
    }
  extension.js: |
    const vscode = require('vscode');
    console.log('Kodewriter Chat: Extension loading...');

    class KodewriterViewProvider {
        static viewType = 'kodewriter.chatView';
        constructor(extensionUri) { this.extensionUri = extensionUri; }

        resolveWebviewView(webviewView) {
            console.log('Kodewriter Chat: Resolving WebviewView...');
            webviewView.webview.options = { enableScripts: true };
            webviewView.webview.html = this.getHtml();
        }

        getHtml() {
            return `
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; frame-src *; img-src * data:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline';">
                <style>
                    html, body { padding: 0; margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020617; color: white; }
                    iframe { width: 100%; height: 100%; border: none; }
                </style>
            </head>
            <body>
                <iframe src="https://kodewriter.michaelhomelab.work/agent" 
                        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
                        allow="clipboard-read; clipboard-write"></iframe>
            </body>
            </html>`;
        }
    }

    function activate(context) {
        console.log('Kodewriter Chat: Extension activating...');
        const provider = new KodewriterViewProvider(context.extensionUri);
        context.subscriptions.push(
            vscode.window.registerWebviewViewProvider(KodewriterViewProvider.viewType, provider)
        );
        console.log('Kodewriter Chat: Provider registered.');
    }
    module.exports = { activate, deactivate: () => {} };
