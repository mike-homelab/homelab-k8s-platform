apiVersion: apps/v1
kind: Deployment
metadata:
  name: kito-artifact-generator
  namespace: kito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kito-artifact-generator
  template:
    metadata:
      labels:
        app: kito-artifact-generator
    spec:
      containers:
      - name: artifact-generator
        image: harbor.michaelhomelab.work/kito/artifact-generator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
          name: http
        envFrom:
        - configMapRef:
            name: kito-config
        - secretRef:
            name: kito-slack-secrets
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5002
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 10
