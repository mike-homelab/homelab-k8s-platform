apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: azure-keyvault
  namespace: kito
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: "https://kv-kito-prod.vault.azure.net"
      tenantId: "0af59592-b763-44a8-8f51-e9aabe8704a4"
      authInfo:
        servicePrincipal:
          clientId: "ca81c0f4-fae6-4e94-8ef9-e8add803ec32"
          clientSecretSecretRef:
            name: azure-kv-creds
            key: client-secret
