apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kito-slack-secrets
  namespace: kito
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: kito-slack-secrets
    creationPolicy: Owner
  data:
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: slack-bot-token
    - secretKey: SLACK_SIGNING_SECRET
      remoteRef:
        key: slack-signing-secret
    - secretKey: AZURE_STORAGE_CONNECTION_STRING
      remoteRef:
        key: azure-storage-connection-string
    - secretKey: AZURE_SEARCH_KEY
      remoteRef:
        key: azure-search-key
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: minio-access-key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: minio-secret-key
