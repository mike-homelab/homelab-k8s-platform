apiVersion: apps/v1
kind: Deployment
metadata:
  name: kito-bot-service
  namespace: kito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kito-bot-service
  template:
    metadata:
      labels:
        app: kito-bot-service
    spec:
      containers:
      - name: bot-service
        image: harbor.michaelhomelab.work/kito/bot-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: kito-config
        - secretRef:
            name: kito-slack-secrets
        env:
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres.kito.svc:5432/kito"
        - name: LANGFUSE_HOST
          value: "http://langfuse.ai-platform.svc:3000"
        - name: LANGFUSE_PUBLIC_KEY
          value: "pk-lf-c696e432-5183-47fb-81d4-cb34ce3a03cc"
        - name: LANGFUSE_SECRET_KEY
          value: "sk-lf-62703832-cb7d-4333-9e30-6c55a7b9dbee"
        - name: BUILDER_VL_ENDPOINT
          value: "http://builder.ai-platform.svc:11434/v1"
        - name: DOCLING_SERVICE_URL
          value: "http://builder.ai-platform.svc:8100"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5

