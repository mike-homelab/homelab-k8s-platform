apiVersion: apps/v1
kind: Deployment
metadata:
  name: kito-bot-service
  namespace: kito
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kito-bot-service
  template:
    metadata:
      labels:
        app: kito-bot-service
    spec:
      containers:
      - name: bot-service
        image: harbor.michaelhomelab.work/kito/bot-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: kito-config
        - secretRef:
            name: kito-slack-secrets
        env:
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres.kito.svc:5432/kito"
        - name: BUILDER_VL_ENDPOINT
          value: "http://builder.ai-platform.svc:11434/v1"
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"        # Docling PyTorch uses all cores for CPU inference
            memory: 4Gi     # Docling models ~600MB + processing headroom per document
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 60   # Docling model load on first import takes ~15-30s
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 5

