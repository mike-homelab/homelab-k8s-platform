apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: openvscode-server
  template:
    metadata:
      labels:
        app: openvscode-server
    spec:
      containers:
        - name: openvscode-server
          image: gitpod/openvscode-server:1.109.5
          args:
            - --host
            - 0.0.0.0
            - --port
            - "3000"
            - --without-connection-token
            - --server-base-path
            - /ide
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: workspace
              mountPath: /home/workspace
            - name: extension
              mountPath: /home/openvscode-server/.openvscode-server/extensions/kodewriter-sidebar
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-pvc
        - name: extension
          configMap:
            name: kodewriter-extension
---
apiVersion: v1
kind: Service
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  selector:
    app: openvscode-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
