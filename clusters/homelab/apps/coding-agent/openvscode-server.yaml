apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: openvscode-server
  template:
    metadata:
      labels:
        app: openvscode-server
      annotations:
        rollout-timestamp: "${{ date }}"
    spec:
      containers:
        - name: openvscode-server
          image: gitpod/openvscode-server:1.103.1
          command:
            - sh
            - -c
            - |
              # Start the server in the background
              /home/.openvscode-server/bin/openvscode-server --host 0.0.0.0 --port 3000 --without-connection-token --server-base-path /ide &
              # Wait for the server to start
              sleep 10
              # Attempt to open the Agent URL (this triggers the Simple Browser)
              /home/.openvscode-server/bin/openvscode-server --open-url https://kodewriter.michaelhomelab.work/agent/
              # Keep the container alive by waiting on the background process
              wait
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: workspace
              mountPath: /home/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  selector:
    app: openvscode-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
