apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvscode-server
  namespace: coding-agent

spec:
  strategy:
    type: Recreate

  replicas: 1

  selector:
    matchLabels:
      app: openvscode-server

  template:
    metadata:
      labels:
        app: openvscode-server

    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: openvscode-server

          image: harbor.michaelhomelab.work/homelab/ai-agent/coding-agent/kodewriter-ide:0.1.2

          args:
            - --host
            - 0.0.0.0
            - --port
            - "3000"
            - --without-connection-token
            - --server-base-path
            - /ide
            - --workspace-folder
            - /workspace

          ports:
            - containerPort: 3000

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: extension-config
              mountPath: /home/workspace/.openvscode-server/extensions/kodewriter-agent-chat/package.json
              subPath: package.json
            - name: extension-config
              mountPath: /home/workspace/.openvscode-server/extensions/kodewriter-agent-chat/extension.js
              subPath: extension.js
            - name: extension-config
              mountPath: /workspace/.openvscode-server/extensions/kodewriter-agent-chat/package.json
              subPath: package.json
            - name: extension-config
              mountPath: /workspace/.openvscode-server/extensions/kodewriter-agent-chat/extension.js
              subPath: extension.js

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-pvc
        - name: extension-config
          configMap:
            name: kodewriter-extension

---
apiVersion: v1
kind: Service
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  selector:
    app: openvscode-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000