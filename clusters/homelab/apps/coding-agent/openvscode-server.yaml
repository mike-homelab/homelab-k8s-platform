apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: openvscode-server
  template:
    metadata:
      labels:
        app: openvscode-server
      annotations:
        rollout-timestamp: "${{ date }}"
    spec:
      initContainers:
        - name: install-extension
          image: busybox
          command:
            - sh
            - -c
            - |
              # Create the directory structure in the persistent workspace
              mkdir -p /workspace/.openvscode-server/extensions/kodewriter-sidebar
              # Copy the extension files from the ConfigMap
              cp /config/package.json /workspace/.openvscode-server/extensions/kodewriter-sidebar/
              cp /config/extension.js /workspace/.openvscode-server/extensions/kodewriter-sidebar/
              # Fix permissions for the IDE user
              chmod -R 777 /workspace/.openvscode-server/extensions/kodewriter-sidebar
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: extension-config
              mountPath: /config
      containers:
        - name: openvscode-server
          image: gitpod/openvscode-server:1.103.1
          args:
            - --host
            - 0.0.0.0
            - --port
            - "3000"
            - --without-connection-token
            - --server-base-path
            - /ide
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: workspace
              mountPath: /home/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-pvc
        - name: extension-config
          configMap:
            name: kodewriter-extension
---
apiVersion: v1
kind: Service
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  selector:
    app: openvscode-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
