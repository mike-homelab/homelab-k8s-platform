apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: openvscode-server
  template:
    metadata:
      labels:
        app: openvscode-server
      annotations:
        rollout-timestamp: "${{ date }}"
    spec:
      containers:
        - name: openvscode-server
          image: harbor.michaelhomelab.work/homelab/ai-agent/coding-agent/kodewriter-ide:0.1.1
          args:
            - --host
            - 0.0.0.0
            - --port
            - "3000"
            - --without-connection-token
            - --server-base-path
            - /ide
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: workspace
              mountPath: /home/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: openvscode-server
  namespace: coding-agent
spec:
  selector:
    app: openvscode-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
