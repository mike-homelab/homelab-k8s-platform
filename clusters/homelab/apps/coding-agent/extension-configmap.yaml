apiVersion: v1
kind: ConfigMap
metadata:
  name: kodewriter-extension
  namespace: coding-agent
data:
  package.json: |
    {
      "name": "kodewriter-sidebar",
      "displayName": "Kodewriter Sidebar",
      "version": "0.1.0",
      "publisher": "kodewriter",
      "engines": { "vscode": "^1.80.0" },
      "categories": [ "Other" ],
      "activationEvents": ["*"],
      "contributes": {
        "viewsContainers": {
          "activitybar": [
            {
              "id": "kodewriter-agent",
              "title": "Kodewriter",
              "icon": "$(robot)"
            }
          ]
        },
        "views": {
          "kodewriter-agent": [
            {
              "type": "webview",
              "id": "kodewriter.agentView",
              "name": "Agent Chat"
            }
          ]
        }
      },
      "main": "./extension.js"
    }
  extension.js: |
    const vscode = require('vscode');
    console.log('Kodewriter Sidebar: Extension loading...');

    class KodewriterViewProvider {
        static viewType = 'kodewriter.agentView';
        constructor(extensionUri) { this.extensionUri = extensionUri; }

        resolveWebviewView(webviewView) {
            console.log('Kodewriter Sidebar: Resolving WebviewView...');
            webviewView.webview.options = { enableScripts: true };
            webviewView.webview.html = this.getHtml();
        }

        getHtml() {
            return `
            <!DOCTYPE html>
            <html lang="en">
            <body>
                <h1 style="color: white;">Hello from Kodewriter Extension</h1>
                <p style="color: white;">If you see this, webviews are working.</p>
            </body>
            </html>`;
        }
    }

    function activate(context) {
        console.log('Kodewriter Sidebar: Extension activating...');
        const provider = new KodewriterViewProvider(context.extensionUri);
        context.subscriptions.push(
            vscode.window.registerWebviewViewProvider(KodewriterViewProvider.viewType, provider)
        );
        console.log('Kodewriter Sidebar: Provider registered.');
    }
    module.exports = { activate, deactivate: () => {} };
