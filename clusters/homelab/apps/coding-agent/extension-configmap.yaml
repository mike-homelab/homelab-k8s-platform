apiVersion: v1
kind: ConfigMap
metadata:
  name: kodewriter-extension
  namespace: coding-agent
data:
  package.json: |
    {
      "name": "kodewriter-sidebar",
      "displayName": "Kodewriter Sidebar",
      "version": "0.1.0",
      "publisher": "kodewriter",
      "engines": { "vscode": "^1.60.0" },
      "categories": [ "Other" ],
      "activationEvents": ["*"],
      "contributes": {
        "viewsContainers": {
          "activitybar": [
            {
              "id": "kodewriter-agent",
              "title": "Kodewriter Agent",
              "icon": "$(robot)"
            }
          ]
        },
        "views": {
          "kodewriter-agent": [
            {
              "type": "webview",
              "id": "kodewriter.agentView",
              "name": "Agent Chat"
            }
          ]
        }
      },
      "main": "./extension.js"
    }
  extension.js: |
    const vscode = require('vscode');
    function activate(context) {
        const provider = {
            resolveWebviewView: (webviewView) => {
                webviewView.webview.options = { enableScripts: true };
                webviewView.webview.html = `
                    <!DOCTYPE html>
                    <html lang="en" style="height: 100%; width: 100%;">
                    <body style="margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #020617;">
                        <iframe src="https://kodewriter.michaelhomelab.work/agent/" 
                                style="width: 100%; height: 100%; border: none;"
                                allow="clipboard-read; clipboard-write;"></iframe>
                    </body>
                    </html>`;
            }
        };
        context.subscriptions.push(
            vscode.window.registerWebviewViewProvider('kodewriter.agentView', provider)
        );
    }
    module.exports = { activate, deactivate: () => {} };
