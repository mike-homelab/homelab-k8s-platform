apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-api
  namespace: coding-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harness-api
  template:
    metadata:
      labels:
        app: harness-api
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - openvscode-server
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: harness-api
          image: harbor.michaelhomelab.work/homelab/ai-agent/coding-agent/kodewriter-harness:0.1.4
          ports:
            - containerPort: 8000
          env:
            - name: LITELLM_BASE
              value: "http://litellm.ai-platform.svc:4000/v1"
            - name: REDIS_URL
              value: "redis://redis.ai-platform.svc:6379"
          volumeMounts:
            - name: workspace
              mountPath: /home/workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: harness-api
  namespace: coding-agent
spec:
  selector:
    app: harness-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
